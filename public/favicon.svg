<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Vertical gradient: lighter at top, deeper at bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4a2e"/>
      <stop offset="100%" stop-color="#0d2117"/>
    </linearGradient>
    <!-- Soft inner highlight to add depth -->
    <radialGradient id="shine" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle inner shine for depth -->
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Graduation cap (mortarboard) -->
  <!-- Diamond board — the flat top -->
  <polygon points="16,6.5 27,11 16,15.5 5,11" fill="#c6e8d4"/>
  <!-- Cap dome / cylinder below the board -->
  <path d="M10,13 Q10,19.5 16,22.5 Q22,19.5 22,13" fill="#c6e8d4"/>
  <!-- Tassel cord from right corner of board -->
  <line x1="27" y1="11" x2="27" y2="17.5"
        stroke="#c6e8d4" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Tassel bob -->
  <circle cx="27" cy="20" r="2.4" fill="#c6e8d4"/>
</svg>
